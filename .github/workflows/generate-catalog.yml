name: Generate activity catalog

on:
  pull_request:
    paths:
      - "activities/**/activity.md"
      - "scripts/generate_catalog.rb"
      - ".github/workflows/generate-catalog.yml"
  push:
    branches: [main]
    paths:
      - "activities/**/activity.md"
      - "scripts/generate_catalog.rb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate activity metadata
        if: github.event_name == 'pull_request'
        run: ruby scripts/generate_catalog.rb --validate

      - name: Generate list.json
        if: github.event_name != 'pull_request'
        run: ruby scripts/generate_catalog.rb

      - name: Commit generated catalog
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- list.json; then
            echo "list.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add list.json
          git commit -m "Generate activity catalog [skip ci]"
          git push
